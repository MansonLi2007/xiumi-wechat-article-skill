<!--
  秀米/公众号手拼片段参考（paper 主题）
  用法：把需要的片段复制进 article.html，或直接在公众号编辑器「源码」里粘贴。
  规则：全部内联样式；不用 class/id；图片 100% 宽；双栏用 table。
-->

<!-- ========== 双栏：图左文右 ========== -->
<table role="presentation" style="width:100%;border-collapse:collapse;margin:24px 0;">
  <tr>
    <td style="width:48%;vertical-align:middle;padding-right:10px;">
      <img src="images/sample-body.jpg" style="width:100%;display:block;border-radius:10px;" alt="示意图"/>
    </td>
    <td style="width:52%;vertical-align:middle;padding-left:10px;font-size:15px;line-height:1.8;color:#4A463F;">
      右栏放一句解释，两到三行就够，再多会被压成窄条。
    </td>
  </tr>
</table>

<!-- ========== 双图并排 ========== -->
<table role="presentation" style="width:100%;border-collapse:collapse;margin:24px 0;">
  <tr>
    <td style="width:50%;padding-right:5px;">
      <img src="images/sample-body.jpg" style="width:100%;display:block;border-radius:10px;" alt="左图"/>
    </td>
    <td style="width:50%;padding-left:5px;">
      <img src="images/sample-body.jpg" style="width:100%;display:block;border-radius:10px;" alt="右图"/>
    </td>
  </tr>
</table>
<p style="margin:8px 0 24px;font-size:13px;line-height:1.6;color:#8A8580;text-align:center;">左：说明一　右：说明二</p>

<!-- ========== 分割线三种 ========== -->
<section style="margin:32px 0;border-top:1px solid #E6E1D8;"></section>
<section style="margin:32px 0;text-align:center;color:#C9C2B6;font-size:13px;letter-spacing:8px;">· · ·</section>
<section style="margin:32px auto;width:40px;border-top:2px solid #B4552D;"></section>

<!-- ========== 图片 + 图注 ========== -->
<section style="margin:24px 0;">
  <img src="images/sample-body.jpg" style="width:100%;display:block;border-radius:10px;" alt="图注内容"/>
  <p style="margin:8px 0 0;font-size:13px;line-height:1.6;color:#8A8580;text-align:center;">图 1　2024 年打开率变化</p>
</section>

<!-- ========== 结尾：关注引导 + 二维码 ========== -->
<section style="margin:40px 0 8px;padding-top:24px;border-top:1px dashed #E6E1D8;text-align:center;">
  <p style="margin:0 0 6px;font-size:15px;line-height:1.8;color:#4A463F;">如果这篇有用，转给那个总在改稿的人。</p>
  <p style="margin:0 0 16px;font-size:13px;line-height:1.8;color:#8A8580;">每周三更新一篇排版与内容方法。</p>
  <img src="images/qrcode.png" style="width:120px;height:120px;display:block;margin:0 auto;" alt="公众号二维码"/>
  <p style="margin:8px 0 0;font-size:12px;color:#B5AFA4;">长按识别，关注「示例账号」</p>
</section>

<!-- ========== 强调提示条 ========== -->
<section style="margin:20px 0;padding:14px 16px;background:#F3E6DE;border-left:3px solid #B4552D;border-radius:0 8px 8px 0;">
  <p style="margin:0;font-size:15px;line-height:1.8;color:#4A463F;">提示：正文不要放外链，微信会直接去掉。</p>
</section>
